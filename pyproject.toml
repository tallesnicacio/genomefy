[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genomefy"
version = "0.2.0"
description = "Local, selective and auditable context memory for AI workflows"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Genomefy contributors" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/tallesnicacio/genomefy"
Repository = "https://github.com/tallesnicacio/genomefy"
Issues = "https://github.com/tallesnicacio/genomefy/issues"

[project.optional-dependencies]
mcp = ["mcp>=1.9"]
embeddings = ["sentence-transformers>=3.0"]
tokens = ["tiktoken>=0.8"]
dev = ["pytest>=8.0"]

[project.scripts]
genomefy = "genomefy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
